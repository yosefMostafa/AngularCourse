<form (ngSubmit)="onSubmit({ title: titleInput.value, content: contentInput.value })" >
  <app-control label="Name">
    <input type="text" name="name" id="name" #titleInput />
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #contentInput></textarea>
  </app-control>
  <p>
    <button appButton>
     Submit Ticket
     <span ngProjectAs="icon"> ⌲ </span>
    </button>
  </p>
</form>
