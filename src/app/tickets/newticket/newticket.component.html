<form (ngSubmit)="onSubmit({ title: titleInput.value, content: contentInput.value })" #form>
  <app-control label="Name">
    <input type="text" name="name" id="name" #titleInput #input/>
  </app-control>
  <app-control label="Request">
    <textarea name="request" id="request" rows="3" #contentInput #input></textarea>
  </app-control>
  <p>
    <button appButton>
     Submit Ticket
     <span ngProjectAs="icon"> ⌲ </span>
    </button>
  </p>
</form>
